[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-predict-lab"
version = "0.2.0"
description = "End-to-end soccer prediction and sports analytics project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "catboost>=1.2.5",
  "joblib>=1.3",
  "requests>=2.31",
  "streamlit>=1.36",
  "plotly>=5.22"
]

[project.scripts]
soccer-predict = "soccer_predict_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
